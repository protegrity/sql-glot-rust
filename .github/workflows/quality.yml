name: Rust quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validation toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features and documentation
        run: cargo test --locked --all-features
      - name: Build API documentation without warnings
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps
      - name: Test default features
        run: cargo test --locked --no-default-features
      - name: Check benchmark cases
        run: cargo bench --locked --bench parser_bench -- CTAS --test

  operator-semantics:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Build CLI
        run: cargo build --locked --features cli --bin sqlglot
      - name: Validate SQLite and MySQL operator semantics
        run: >-
          python3 scripts/operator_precedence.py --binary target/debug/sqlglot
          --mysql-command mysql --protocol=tcp --host=127.0.0.1 --user=root
